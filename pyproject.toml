[project]
name = "langgraph-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmed-niaz", email = "inestnetwork@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.1",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.23",
    "pydantic>=2.14.4",
    "pydentic>=0.0.1.dev3",
    "pypdf>=7.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-learning = "langgraph_learning:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[tool.uv]
package = false
